<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="360" viewBox="0 0 1440 360" role="img" aria-labelledby="title desc">
  <title id="title">RyzeMCBE Development Studio</title>
  <desc id="desc">Orange geometric fox logo, RyzeMCBE wordmark, Development Studio tagline and abstract developer grid on dark navy background.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070D19"/><stop offset=".62" stop-color="#111B2F"/><stop offset="1" stop-color="#080E1B"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FFC06F"/><stop offset=".48" stop-color="#FF8A29"/><stop offset="1" stop-color="#FF5E13"/></linearGradient>
    <linearGradient id="outline" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#F97316"/><stop offset=".75" stop-color="#3B82F6"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#E86C21" stop-opacity=".2"/><stop offset="1" stop-color="#E86C21" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#31435D" stroke-width="1" opacity=".26"/></pattern>
  </defs>
