    <text x="384" y="196" font-size="28" font-weight="700" letter-spacing="9" fill="#B5C6DA">DEVELOPMENT STUDIO</text>
    <rect x="384" y="217" width="590" height="3" rx="1.5" fill="url(#outline)"/>
    <text x="384" y="262" font-size="21" letter-spacing=".6" fill="#DEE7F4">Engineering software. Creating experiences.</text>
    <text x="384" y="294" font-size="18" letter-spacing=".7" fill="#8FA7C3">GAME SERVERS  ·  DEVELOPER TOOLS  ·  AI &amp; AUTOMATION</text>
